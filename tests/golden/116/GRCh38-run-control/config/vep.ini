# The flags of the default run plus the tab output, read as <dir>/vep.ini when --dir names this directory
cache 1
cache_version 116
offline 1
species homo_sapiens
assembly GRCh38
buffer_size 5000
force_overwrite 1
no_stats 1
quiet 1
protein 1
protein_version 1
mask_header_cache_path 1
max_sv_size -1
tab 1
