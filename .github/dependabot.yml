version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # noodles 0.117 and noodles-bgzf 0.52 and later declare rust-version
      # 1.91, above the workspace's declared rust-version.
      - dependency-name: noodles
        versions: [">= 0.117"]
      - dependency-name: noodles-bgzf
        versions: [">= 0.52"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The `toolchain:` input of every rust-toolchain step is a Rust version,
      # not an action version: the MSRV job's must equal the manifest's
      # rust-version and the others must equal the release toolchain, so a
      # proposal to change either is not a dependency update.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
