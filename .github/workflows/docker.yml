name: Docker

# Packages a published release's attested Linux binaries as the container
# image `IMAGE` names. Publishing a release pushes a multi-platform image
# under X.Y.Z, plus X.Y and latest when it is the newest
# (scripts/docker/image_tags.sh), joined from the matrix rows of role
# `platform`: the generic archives, built for a CPU floor almost every 64-bit
# host of their architecture meets. The measured archives, the binaries the
# release page's figures were taken on, go out as the single-platform tags of
# the rows of role `tag`. Each platform builds on a runner of its own
# architecture, never under emulation. `workflow_dispatch` packages any
# published tag that carries every archive of the matrix and pushes only when
# asked, from main. A pull request touching the image builds and smoke-tests
# the newest release and pushes nothing. Every image is pushed by digest alone
# and smoke-tested as pulled; the tags are created last, by the publish job,
# once every row has passed, so a tag never names an image that failed its
# smoke test and a failed row leaves the release untagged. The platform
# members of the multi-platform tags stay untagged by design, so "delete every
# untagged version" in this registry destroys the live tags; a failed run's
# leftover is told apart only by no tag or manifest list naming it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to package (vX.Y.Z)
        required: true
      push:
        description: Push the image to GHCR
        type: boolean
        default: false
  pull_request:
    paths:
      - docker/**
      - scripts/docker/**
      - .github/workflows/docker.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: docker-${{ github.event.release.tag_name || inputs.tag || github.ref }}

env:
  IMAGE: ghcr.io/natera-open-source/vep-rs
  BUILDKIT_IMAGE: moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
  # The archives the matrix rows below package, one per row: a release or
  # dispatch run needs them all before any row pushes.
  ARCHIVES: x86_64-unknown-linux-gnu-v2 x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu-generic aarch64-unknown-linux-gnu

jobs:
  image:
    name: Build and smoke-test ${{ matrix.archive }}
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One row per image: the archive it packages (the suffix after
      # `vep-X.Y.Z-`), the platform it runs on, and its `role`: `platform`, a
      # member of the multi-platform tags, or `tag`, its own single-platform
      # tag `X.Y.Z-<tag>`.
      matrix:
        include:
          - archive: x86_64-unknown-linux-gnu-v2
            platform: linux/amd64
            os: ubuntu-latest
            role: platform
          - archive: x86_64-unknown-linux-gnu
            platform: linux/amd64
            os: ubuntu-latest
            role: tag
            tag: x86-64-v3
          - archive: aarch64-unknown-linux-gnu-generic
            platform: linux/arm64
            os: ubuntu-24.04-arm
            role: platform
          - archive: aarch64-unknown-linux-gnu
            platform: linux/arm64
            os: ubuntu-24.04-arm
            role: tag
            tag: neoverse-v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      push: ${{ steps.meta.outputs.push }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < docker/Dockerfile

      - name: Resolve the tag and whether to push
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUSH: ${{ inputs.push }}
        run: |
          case "$EVENT" in
            release) tag="$RELEASE_TAG"; push=true ;;
            workflow_dispatch) tag="$INPUT_TAG"; push="$INPUT_PUSH" ;;
            *) tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"; push=false ;;
          esac
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ERROR: [docker] tag '$tag' is not vX.Y.Z" >&2; exit 1; }
          if [[ "$push" == true && "$GITHUB_REF" != refs/heads/main && "$EVENT" == workflow_dispatch ]]; then
            echo "ERROR: [docker] push=true is allowed only from main, not $GITHUB_REF" >&2; exit 1
          fi
          { echo "tag=$tag"; echo "version=${tag#v}"; echo "push=$push"; } >> "$GITHUB_OUTPUT"
          echo "packaging $tag (push=$push)"

      # A release or dispatch run packages a release only when it carries
      # every archive of the matrix, so no row pushes an image of a release
      # another row cannot package. A pull request packages the newest
      # published release, which may carry only the measured archives: a row
      # whose archive the release lacks has nothing to build and says so.
      - name: Check that the release carries the archives
        id: asset
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          missing=()
          for archive in $ARCHIVES; do
            file="vep-$VERSION-$archive.tar.gz"
            grep -qxF "$file" <<<"$assets" || missing+=("$file")
          done
          own="vep-$VERSION-$ARCHIVE.tar.gz"
          if [[ "${#missing[@]}" -eq 0 ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" != pull_request ]]; then
            echo "ERROR: [docker] release $TAG lacks ${missing[*]}" >&2; exit 1
          elif grep -qxF "$own" <<<"$assets"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::release $TAG has no $own; this row builds nothing"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # The smoke test runs the release's own corpus, so an older binary is
      # never handed a cache format newer than it reads.
      - name: Check out the release's golden corpora
        if: steps.asset.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.tag }}
          path: release-src
          sparse-checkout: tests/golden
          persist-credentials: false

      # Release directories coexist while an older release is kept; the newest
      # is the current corpus.
      - name: Locate the release's GRCh37 corpus
        if: steps.asset.outputs.present == 'true'
        id: corpus
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          corpus="$(find release-src/tests/golden -mindepth 2 -maxdepth 2 -type d -name GRCh37 | sort -V | tail -n 1)"
          [[ -n "$corpus" && -f "$corpus/variants.vcf" ]] ||
            { echo "ERROR: [docker] no tests/golden/<release>/GRCh37 corpus in the $TAG tree" >&2; exit 1; }
          echo "path=$corpus" >> "$GITHUB_OUTPUT"
          echo "smoke-test corpus $corpus"

      - name: Stage the verified release binaries
        if: steps.asset.outputs.present == 'true'
        run: scripts/docker/stage_release.sh "${{ steps.meta.outputs.tag }}" "${{ matrix.archive }}" "$RUNNER_TEMP/context"

      # A container-driver builder: the only one that pushes by digest.
      - name: Create the builder
        if: steps.asset.outputs.present == 'true'
        run: docker buildx create --name vep-rs --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --use

      - name: Log in to GHCR
        if: steps.asset.outputs.present == 'true' && steps.meta.outputs.push == 'true'
        env:
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      # Without a push the image is loaded into the local daemon for the smoke
      # test; with one it is pushed by digest, untagged, and pulled back, so the
      # bytes the smoke test runs are the bytes in the registry.
      - name: Build
        id: build
        if: steps.asset.outputs.present == 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ steps.meta.outputs.version }}
          PUSH: ${{ steps.meta.outputs.push }}
        run: |
          args=(--platform "$PLATFORM" --provenance=false --sbom=false --file docker/Dockerfile
                --build-arg "VERSION=$VERSION" "$RUNNER_TEMP/context")
          if [[ "$PUSH" == true ]]; then
            docker buildx build "${args[@]}" \
              --output "type=image,name=$IMAGE,push=true,push-by-digest=true,name-canonical=true" \
              --metadata-file "$RUNNER_TEMP/build.json"
            digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "ERROR: [docker] the build reported no digest: $digest" >&2; exit 1; }
            docker pull "$IMAGE@$digest"
            ref="$IMAGE@$digest"
          else
            docker buildx build "${args[@]}" --load --tag vep-rs:smoke
            digest=""
            ref=vep-rs:smoke
          fi
          { echo "ref=$ref"; echo "digest=$digest"; } >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.asset.outputs.present == 'true'
        run: >-
          docker run --rm
          -v "$PWD/scripts/docker:/smoke:ro"
          -v "$PWD/${{ steps.corpus.outputs.path }}:/corpus:ro"
          "${{ steps.build.outputs.ref }}" bash /smoke/smoke_test.sh "${{ steps.meta.outputs.version }}"

      - name: Attest the pushed image
        if: steps.asset.outputs.present == 'true' && steps.meta.outputs.push == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The row's digest, platform, role and tag go to the publish job, which
      # tags once every row has passed.
      - name: Record the image
        if: steps.asset.outputs.present == 'true' && steps.meta.outputs.push == 'true'
        env:
          ARCHIVE: ${{ matrix.archive }}
          PLATFORM: ${{ matrix.platform }}
          ROLE: ${{ matrix.role }}
          TAG: ${{ matrix.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          echo "$DIGEST $PLATFORM $ROLE $TAG" > "$RUNNER_TEMP/images/$ARCHIVE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.asset.outputs.present == 'true' && steps.meta.outputs.push == 'true'
        with:
          name: image-${{ matrix.archive }}
          path: ${{ runner.temp }}/images/*
          if-no-files-found: error

  # The one check the branch rules can name: it fails when any image did, and
  # with a push it creates every tag from the images the rows pushed.
  publish:
    name: Build, smoke-test and publish
    needs: image
    if: always() && (github.event_name != 'release' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require every image
        env:
          RESULT: ${{ needs.image.result }}
        run: |
          [[ "$RESULT" == success ]] || { echo "ERROR: [docker] an image job ended $RESULT" >&2; exit 1; }
          echo "every image row succeeded"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.image.outputs.push == 'true'
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.image.outputs.push == 'true'
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Log in to GHCR
        if: needs.image.outputs.push == 'true'
        env:
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      # Every record is read and checked before anything is tagged. Then one
      # manifest list over the platform members under every tag the release
      # earns (its digest is what `docker pull <image>:X.Y.Z` resolves and
      # what the attestation names), then the single-platform tags, each the
      # attested manifest itself: given one source, `imagetools create`
      # otherwise wraps it in a manifest list with a digest of its own, which
      # the attestation does not name.
      - name: Push the tags
        id: push
        if: needs.image.outputs.push == 'true'
        env:
          TAG: ${{ needs.image.outputs.tag }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          members=()
          single=()
          for archive in $ARCHIVES; do
            [[ -s "$RUNNER_TEMP/images/$archive" ]] || { echo "ERROR: [docker] no image record for $archive" >&2; exit 1; }
            read -r digest platform role tag < "$RUNNER_TEMP/images/$archive"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "ERROR: [docker] $archive recorded no digest: $digest" >&2; exit 1; }
            case "$role" in
              platform) members+=("$IMAGE@$digest") ;;
              tag)
                [[ -n "$tag" ]] || { echo "ERROR: [docker] $archive ($platform) recorded no tag" >&2; exit 1; }
                single+=("$IMAGE:$VERSION-$tag=$digest") ;;
              *) echo "ERROR: [docker] $archive recorded the role '$role'" >&2; exit 1 ;;
            esac
          done
          [[ "${#members[@]}" -eq 2 && "${#single[@]}" -eq 2 ]] ||
            { echo "ERROR: [docker] ${#members[@]} platform members and ${#single[@]} single-platform tags recorded; two of each expected" >&2; exit 1; }
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1000 --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/published.txt"
          scripts/docker/image_tags.sh "$IMAGE" "$TAG" < "$RUNNER_TEMP/published.txt" > "$RUNNER_TEMP/tags.txt"
          tags=()
          while read -r ref; do tags+=(--tag "$ref"); done < "$RUNNER_TEMP/tags.txt"
          docker buildx imagetools create "${tags[@]}" "${members[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "ERROR: [docker] $IMAGE:$VERSION resolves to no digest: $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed $(paste -sd' ' "$RUNNER_TEMP/tags.txt") at $digest"
          for entry in "${single[@]}"; do
            ref="${entry%=*}"
            attested="${entry##*=}"
            docker buildx imagetools create --prefer-index=false --tag "$ref" "$IMAGE@$attested"
            tagged="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
            [[ "$tagged" == "$attested" ]] || { echo "ERROR: [docker] $ref resolves to $tagged, not the attested $attested" >&2; exit 1; }
            echo "tagged $ref at $attested"
          done

      - name: Attest the multi-platform image
        if: needs.image.outputs.push == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
