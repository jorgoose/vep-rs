name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # tools/vep-fields-compare is its own Cargo root, so a `--workspace` command
        # never reaches it; `comparator` is the same check over that package.
        include:
          - name: Test
            command: cargo test --workspace --locked
            comparator: cargo test --locked --manifest-path tools/vep-fields-compare/Cargo.toml
          - name: Clippy
            command: cargo clippy --workspace -- -D warnings
            comparator: cargo clippy --all-targets --locked --manifest-path tools/vep-fields-compare/Cargo.toml -- -D warnings
          - name: Format
            command: cargo fmt --all -- --check
            comparator: cargo fmt --all --manifest-path tools/vep-fields-compare/Cargo.toml -- --check
          # Catches a license header run into a module's `//!` doc line with no
          # blank line between them. Test/Clippy/Format are all blind to it: the
          # joined line is a valid comment, so everything compiles and passes while
          # the first rustdoc line is silently lost.
          - name: Module Docs
            command: scripts/check_module_docs.sh
            comparator: scripts/check_module_docs.sh tools

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The Parquet round-trip test skips itself without the DuckDB CLI; the
      # Test job installs it so the skip cannot hide a regression.
      - if: matrix.name == 'Test'
        run: |
          curl -fsSL -o /tmp/duckdb.tar.gz https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz
          echo "c6507206baf7793c6013dbd82368469a45f20dc0e17a6f92f204602f652ed2bc  /tmp/duckdb.tar.gz" | sha256sum --check --strict -
          sudo tar -xzf /tmp/duckdb.tar.gz -C /usr/local/bin duckdb
          duckdb --version
      - run: ${{ matrix.command }}
      - run: ${{ matrix.comparator }}

  # The Python comparators and the golden-corpus generator ship with their own
  # test files; a file that fails to import reports zero failures, so the
  # collected count is asserted per file.
  comparator-tests:
    name: Comparator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --quiet pytest
      - run: |
          set -e
          fail=0
          check() {
            n=$(python3 -m pytest --collect-only -q "$1" | grep -cE '::' || true)
            echo "collected $n from $1 (floor $2)"
            if [ "$n" -lt "$2" ]; then
              echo "ERROR: [comparator-tests] $1 collected $n tests, expected >= $2." >&2
              fail=1
            fi
          }
          check scripts/concordance/test_compare_vep_outputs.py 211
          check scripts/validation/test_compare_sv_concordance.py 248
          check scripts/concordance/test_reference_release.py 17
          check scripts/validation/test_breakend_mate_context.py 24
          check scripts/concordance/test_compare_vep_formats.py 49
          check scripts/concordance/test_compare_vep_fields.py 6
          check scripts/concordance/test_compare_plugin_outputs.py 3
          check scripts/golden/test_golden_scripts.py 140
          check scripts/release/test_render_release_notes.py 137
          check scripts/release/test_check_glibc_floor.py 8
          check scripts/parity/test_check_parity_matrix.py 60
          check scripts/validation/test_diff_caches.py 4
          check scripts/docs/test_site_tools.py 77
          [ "$fail" -eq 0 ]
          python3 -m pytest -q \
            scripts/validation/test_compare_sv_concordance.py \
            scripts/validation/test_breakend_mate_context.py \
            scripts/concordance/test_compare_vep_outputs.py \
            scripts/concordance/test_reference_release.py \
            scripts/concordance/test_compare_vep_formats.py \
            scripts/concordance/test_compare_vep_fields.py \
            scripts/concordance/test_compare_plugin_outputs.py \
            scripts/golden/test_golden_scripts.py \
            scripts/release/test_render_release_notes.py \
            scripts/release/test_check_glibc_floor.py \
            scripts/parity/test_check_parity_matrix.py \
            scripts/validation/test_diff_caches.py \
            scripts/docs/test_site_tools.py
      # The Rust field comparator's goldens are what compare_vep_fields.py writes over its
      # fixture pairs; the Test job holds the binary to them, this step holds the Python,
      # so a change to either side that moves the contract fails here or there. From the
      # package root with relative fixture paths, which the goldens' `inputs` block carries.
      - run: |
          set -e
          cd tools/vep-fields-compare
          actual=$(mktemp -d)
          py=../../scripts/concordance/compare_vep_fields.py
          python3 "$py" --perl tests/fixtures/reference.txt --rust tests/fixtures/scored.txt --out "$actual/fields.json" --tmp-dir "$actual" > "$actual/stdout.txt"
          cmp "$actual/fields.json" tests/fixtures/expected_fields.json
          cmp "$actual/stdout.txt" tests/fixtures/expected_stdout.txt
          python3 "$py" --perl tests/fixtures/reference.txt --rust tests/fixtures/scored.txt --out "$actual/fields_examples1.json" --tmp-dir "$actual" --examples 1 > /dev/null
          cmp "$actual/fields_examples1.json" tests/fixtures/expected_fields_examples1.json
          python3 "$py" --perl tests/fixtures/disjoint_reference.txt --rust tests/fixtures/disjoint_scored.txt --out "$actual/disjoint_fields.json" --tmp-dir "$actual" > "$actual/disjoint_stdout.txt"
          cmp "$actual/disjoint_fields.json" tests/fixtures/expected_disjoint_fields.json
          cmp "$actual/disjoint_stdout.txt" tests/fixtures/expected_disjoint_stdout.txt
      # The parity matrix (tests/parity/matrix.tsv) must name every flag args.rs declares,
      # and every landed row's tests must resolve in this tree.
      - run: python3 scripts/parity/check_parity_matrix.py
      # Every plugin data path run_concordance.sh passes is a file setup_plugin_data.sh
      # stages; both read scripts/data/plugin_data_layout.sh, and this suite proves it.
      - run: |
          bash -n scripts/concordance/run_concordance.sh
          out=$(bash scripts/data/test_plugin_data_layout.sh 2>&1) || { printf '%s\n' "$out"; exit 1; }
          n=$(printf '%s\n' "$out" | grep -c '^  ok ') || n=0
          echo "plugin data layout suite reported $n ok lines (floor 46)"
          [ "$n" -ge 46 ]

  # The measurement harness and the reference-output generator each ship with a
  # pure-bash test suite (stub engines, a stub bcftools, a stub docker) whose
  # checks inject a fault and prove the matching fail-closed gate fires. A suite
  # exits 1 on any failure and prints one `ok` line per passing check; the count
  # is asserted so a suite that silently ran nothing cannot pass.
  harness-tests:
    name: Harness Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -e
          check() {
            out=$(bash "$1" 2>&1) || { printf '%s\n' "$out"; exit 1; }
            n=$(printf '%s\n' "$out" | grep -c '^  ok ') || n=0
            echo "$1 reported $n ok lines (floor $2)"
            [ "$n" -ge "$2" ]
          }
          check scripts/concordance/test_run_clone_measurement.sh 120
          check scripts/concordance/test_generate_reference_output.sh 170
          check scripts/concordance/test_feature_oracle.sh 148
          check scripts/docker/test_image_tags.sh 8
          check scripts/docker/test_stage_release.sh 17
          check scripts/docker/test_smoke_test.sh 15

  # A `cargo audit` advisory is a failure only when the advisory's crate is
  # reachable from the `vep` binary; scripts/check_advisory_reachability.sh makes
  # that distinction and carries the dated allowlist for the rest. cargo-audit is
  # installed from its pinned prebuilt release rather than compiled with
  # `cargo install`, which would dominate the cost of a check that itself
  # compiles nothing.
  advisory-reachability:
    name: Advisory Reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - run: |
          set -euo pipefail
          CARGO_AUDIT_VERSION=0.22.2
          ASSET="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          curl -fsSL "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${ASSET}.tgz" | tar xz -C /tmp
          install -m 0755 "/tmp/${ASSET}/cargo-audit" "${CARGO_HOME:-$HOME/.cargo}/bin/cargo-audit"
          cargo audit --version
      - run: scripts/check_advisory_reachability.sh
      # tools/vep-fields-compare has its own lockfile, outside the script's audit of the
      # root one. The whole lockfile is audited, with no reachability distinction: an
      # advisory of any class on any crate in it, including a backend the build leaves
      # out, fails here and is cleared by a bump.
      - run: cargo audit --deny warnings --file tools/vep-fields-compare/Cargo.lock

  # Builds on the DECLARED minimum supported Rust version rather than the
  # pinned toolchain. Every job above runs the pinned 1.97.1, the toolchain the
  # released binaries are built with, so without this one nothing ever
  # compiles against `rust-version`, and the manifest's floor is a claim no
  # build has exercised. The floor is dependency-driven (see the comment on
  # `rust-version` in Cargo.toml), so a dependency bump can raise it without any
  # source change; this job is what turns that into a failing check instead of
  # a broken promise to whoever reads the manifest.
  #
  # The toolchain version is the step's `toolchain:` input, so the first step
  # asserts that the input still equals the manifest's declaration: bumping one
  # without the other fails here rather than leaving this job quietly testing
  # the old floor.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.89
      - name: Toolchain matches the declared rust-version
        run: |
          actual=$(rustc --version | awk '{print $2}')
          for manifest in Cargo.toml tools/vep-fields-compare/Cargo.toml; do
            declared=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' "$manifest" | head -1)
            echo "$manifest: declared rust-version=$declared, toolchain=$actual"
            case "$actual" in
              "$declared" | "$declared".*) ;;
              *) echo "ERROR: [msrv] toolchain $actual is not the declared rust-version $declared in $manifest; update both the toolchain input and the manifest together" >&2; exit 1 ;;
            esac
          done
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --locked
      - run: cargo build --locked --manifest-path tools/vep-fields-compare/Cargo.toml

  build-release:
    name: Build Release
    needs: [check, msrv]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked --bin vep
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vep-linux-x86_64
          path: target/release/vep
          retention-days: 30
