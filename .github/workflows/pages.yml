name: Pages

# Builds the documentation site from docs/ with mdBook (book.toml) and checks
# its links (scripts/docs/check_site_links.py). A push to main deploys it to
# https://natera-open-source.github.io/vep-rs/; a pull request builds and checks
# it and deploys nothing. The repository's Pages source must be set to
# "GitHub Actions". mdBook is installed from its pinned prebuilt release,
# checked against the SHA-256 below.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - book.toml
      - docs/**
      - scripts/docs/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - README.md
      - book.toml
      - docs/**
      - scripts/docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mdBook
        run: |
          set -euo pipefail
          MDBOOK_VERSION=0.5.4
          MDBOOK_SHA256=5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89
          ASSET="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "/tmp/${ASSET}" "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${ASSET}"
          echo "${MDBOOK_SHA256}  /tmp/${ASSET}" | sha256sum -c -
          tar xzf "/tmp/${ASSET}" -C /tmp
          install -m 0755 /tmp/mdbook /usr/local/bin/mdbook
          mdbook --version
      - run: mdbook build
      - run: python3 scripts/docs/check_site_links.py --site target/book
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: target/book

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
