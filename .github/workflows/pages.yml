name: Pages

# Publishes the documentation site, https://natera-open-source.github.io/vep-rs/,
# in two channels. The site root is the latest release, so it describes the
# binaries users install. scripts/docs/build_release_site.sh takes the pages
# (README.md, CHANGELOG.md, CONTRIBUTING.md, docs/) from the release tag and
# the tooling (book.toml, theme/, scripts/docs/) from main, builds the site
# with mdBook, checks its links and finishes it with
# scripts/docs/site_postbuild.py. The development preview under /main/ is the
# same script's --main form over the pages of main, titled and marked as the
# preview; the header's channel switcher reads the versions.json both builds
# write.
#
# Publishing a release redeploys the site. The github-pages environment deploys
# from main only, and a release run's ref is the tag, so that run dispatches
# this workflow on main rather than deploying itself. A push to main that
# changes a page, the theme or the tooling redeploys both channels: the release
# with the new tooling, the preview with the new pages. `workflow_dispatch`
# deploys the latest release, or the tag it is given, with the preview beside
# it. A pull request builds its own pages, the latest release with its tooling
# and the preview, checks all three and deploys nothing. mdBook is installed
# from its pinned prebuilt release, checked against the sha256sum digest below.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - book.toml
      - docs/**
      - theme/**
      - scripts/docs/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - book.toml
      - docs/**
      - theme/**
      - scripts/docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z); empty publishes the latest release
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dispatch:
    name: Dispatch the deploy on main
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    name: Build and check links
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mdBook
        run: |
          set -euo pipefail
          MDBOOK_VERSION=0.5.4
          MDBOOK_SHA256=5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89
          ASSET="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "/tmp/${ASSET}" "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${ASSET}"
          echo "${MDBOOK_SHA256}  /tmp/${ASSET}" | sha256sum -c -
          tar xzf "/tmp/${ASSET}" -C /tmp
          install -m 0755 /tmp/mdbook /usr/local/bin/mdbook
          mdbook --version
      - name: Build the pull request's pages
        if: github.event_name == 'pull_request'
        run: |
          mdbook build
          python3 scripts/docs/check_site_links.py --site target/book --tree HEAD
          python3 scripts/docs/site_metrics.py --gate
      - name: Build the release's site
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "Building the site of $TAG"
          git fetch --no-tags --depth 1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          scripts/docs/build_release_site.sh "$TAG" target/release-site
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Build the main preview
        run: |
          VEP_RS_DOCS_RELEASE="$RELEASE_TAG" scripts/docs/build_release_site.sh --main target/main-site
      - name: Assemble the two channels
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p target/site
          cp -R target/release-site/target/book/. target/site/
          cp -R target/main-site/target/book target/site/main
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: target/site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
