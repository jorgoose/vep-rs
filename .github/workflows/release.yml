name: Release

# A `v*` tag builds, packages, checksums, attests and creates a DRAFT release;
# a maintainer publishes it after reading the page. `workflow_dispatch` is the
# dry run: the same build, packaging, checksums and rendered body on the
# current branch, uploaded as a workflow artifact, with no attestation and no
# release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.97.1
  # The oldest glibc the Linux archives run on. Both Linux targets link against
  # zig's glibc stubs of this version, the ELF check below refuses a binary that
  # needs a newer symbol version, and the release page prints the measured floor.
  GLIBC_FLOOR: "2.17"
  ZIG_VERSION: 0.17.0
  ZIG_SHA256_X86_64_LINUX: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
  ZIG_SHA256_AARCH64_LINUX: 9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
  CARGO_ZIGBUILD_VERSION: 0.23.4

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One row per archive. `name` is the archive's suffix after `vep-X.Y.Z-`,
      # `cpu` its `-C target-cpu`, `openssl` the conda-forge OpenSSL package the
      # Linux build links (the install step below says why). The two Linux
      # targets each ship twice: the measured build (the CPU floor the release
      # page states) and a generic build for the multi-platform container image
      # and for hosts below that floor. Both Linux architectures build on their
      # own runners, so every Linux binary is smoke-tested on the architecture
      # it was built for.
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: x86_64-unknown-linux-gnu
            cpu: x86-64-v3
            os: ubuntu-latest
            zig: x86_64-linux
            openssl: linux-64/openssl-3.6.5-h781a0a9_0.conda
            openssl_sha256: 9c1533f1cf784f0e250919c0c9762d0b0e6bc727a79290ffb7cea1ceca1d038c
            glibc_image: quay.io/pypa/manylinux2014_x86_64@sha256:2bd80fa8fca6b775a913b7e42fa410c5f2246fb6f7f8f3280b5d562e5ca5d63f
          - target: x86_64-unknown-linux-gnu
            name: x86_64-unknown-linux-gnu-v2
            cpu: x86-64-v2
            os: ubuntu-latest
            zig: x86_64-linux
            openssl: linux-64/openssl-3.6.5-h781a0a9_0.conda
            openssl_sha256: 9c1533f1cf784f0e250919c0c9762d0b0e6bc727a79290ffb7cea1ceca1d038c
            glibc_image: quay.io/pypa/manylinux2014_x86_64@sha256:2bd80fa8fca6b775a913b7e42fa410c5f2246fb6f7f8f3280b5d562e5ca5d63f
          - target: aarch64-unknown-linux-gnu
            name: aarch64-unknown-linux-gnu
            cpu: neoverse-v1
            os: ubuntu-24.04-arm
            zig: aarch64-linux
            openssl: linux-aarch64/openssl-3.6.5-he6ad1d5_0.conda
            openssl_sha256: 238136f1df197ecd89bafd728a34d0642176f3170423d13d8276746d675a9485
            glibc_image: quay.io/pypa/manylinux2014_aarch64@sha256:01984696ca71627d9f61991da836e5d542aa21695e8337ab0dc1f27a4559502f
          - target: aarch64-unknown-linux-gnu
            name: aarch64-unknown-linux-gnu-generic
            cpu: generic
            os: ubuntu-24.04-arm
            zig: aarch64-linux
            openssl: linux-aarch64/openssl-3.6.5-he6ad1d5_0.conda
            openssl_sha256: 238136f1df197ecd89bafd728a34d0642176f3170423d13d8276746d675a9485
            glibc_image: quay.io/pypa/manylinux2014_aarch64@sha256:01984696ca71627d9f61991da836e5d542aa21695e8337ab0dc1f27a4559502f
          - target: aarch64-apple-darwin
            name: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      # The version names every archive and the directory it unpacks to: the
      # tag's on a tag push, the workspace's on a dry run.
      - name: Resolve the release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # zig links the Linux binaries against glibc stubs of GLIBC_FLOOR, so a
      # binary built on a runner with a newer glibc still runs on the floor
      # (Rust's standard library falls back from the newer symbols it would
      # otherwise bind, such as pidfd_spawnp). The tarball is checked against
      # the checksum ziglang.org publishes for the release.
      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        env:
          ZIG_ARCH: ${{ matrix.zig }}
        run: |
          case "$ZIG_ARCH" in
            x86_64-linux) sha="$ZIG_SHA256_X86_64_LINUX" ;;
            aarch64-linux) sha="$ZIG_SHA256_AARCH64_LINUX" ;;
            *) echo "ERROR: [release] no zig checksum for $ZIG_ARCH" >&2; exit 1 ;;
          esac
          curl -fsSLo "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/zig-$ZIG_ARCH-$ZIG_VERSION.tar.xz"
          echo "$sha  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked --version "$CARGO_ZIGBUILD_VERSION"

      # vep-cache-builder links OpenSSL (reqwest's native-tls on Linux). zig
      # ships no OpenSSL, and a distribution's libssl is linked against a newer
      # glibc than the floor, which the linker refuses; conda-forge's OpenSSL
      # for the target is built against glibc 2.17. openssl-sys reads the
      # target-prefixed OPENSSL_DIR. Only the link needs the package: at run
      # time the binaries load the host's own libssl.so.3 and libcrypto.so.3.
      - name: Install OpenSSL for the target
        if: matrix.zig
        env:
          OPENSSL_PACKAGE: ${{ matrix.openssl }}
          OPENSSL_SHA256: ${{ matrix.openssl_sha256 }}
          TARGET: ${{ matrix.target }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/openssl.conda" "https://conda.anaconda.org/conda-forge/$OPENSSL_PACKAGE"
          echo "$OPENSSL_SHA256  $RUNNER_TEMP/openssl.conda" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/openssl"
          unzip -q "$RUNNER_TEMP/openssl.conda" 'pkg-*.tar.zst' -d "$RUNNER_TEMP"
          tar --zstd -xf "$RUNNER_TEMP"/pkg-*.tar.zst -C "$RUNNER_TEMP/openssl" lib include
          echo "$(echo "$TARGET" | tr 'a-z-' 'A-Z_')_OPENSSL_DIR=$RUNNER_TEMP/openssl" >> "$GITHUB_ENV"

      # Each Linux build targets the CPU floor its archive name states; the
      # macOS build takes the target-cpu .cargo/config.toml sets. RUSTFLAGS
      # replaces that file's target rustflags rather than adding to them.
      - name: Set target-cpu for the archive
        if: matrix.cpu
        run: echo "RUSTFLAGS=-C target-cpu=${{ matrix.cpu }}" >> "$GITHUB_ENV"

      # `--locked` refuses to resolve dependencies afresh: a release built from a
      # source commit alone is not reproducible, because a fresh resolution can
      # select later patch versions than the ones Cargo.lock records. The
      # published build pin is the commit, the lockfile and the binary digest
      # together, and only a `--locked` build honours all three.
      #
      # Three binaries ship: `vep` (the annotator), `vep-cache-builder` (builds
      # the transcript cache the README tells users to build) and
      # `vep-cache-converter` (validates caches and converts plugin data).
      - name: Build (zig, glibc floor)
        if: matrix.zig
        run: >-
          cargo zigbuild --release --locked --target ${{ matrix.target }}.${{ env.GLIBC_FLOOR }}
          --bin vep --bin vep-cache-builder --bin vep-cache-converter

      - name: Build (native)
        if: "!matrix.zig"
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          --bin vep --bin vep-cache-builder --bin vep-cache-converter

      # The archive unpacks to its own directory, `vep-X.Y.Z-<name>/`, so two
      # versions extracted side by side do not overwrite each other.
      - name: Package binaries
        run: |
          name="vep-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          for bin in vep vep-cache-builder vep-cache-converter; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$name/$bin"
          done
          tar -C dist -czf "$name.tar.gz" "$name"

      # Every Linux binary is held to the floor by its ELF version needs, then
      # run: the three binaries start on the runner, and `vep` annotates the
      # bundled GRCh37 corpus both on the runner and inside a glibc 2.17
      # container (manylinux2014, CentOS 7), the two outputs equal. The
      # container carries no OpenSSL 3, so vep-cache-builder, which loads the
      # host's libssl.so.3, is started on the runner alone. Running the
      # binaries needs a runner whose CPU meets the archive's floor: the
      # neoverse-v1 row needs SVE, which the arm runners' Neoverse cores have.
      - name: Smoke-test the Linux binaries on the glibc floor
        if: matrix.zig
        env:
          GLIBC_IMAGE: ${{ matrix.glibc_image }}
        run: |
          dir="$PWD/dist/vep-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          python3 scripts/release/check_glibc_floor.py --floor "$GLIBC_FLOOR" "$dir"/vep "$dir"/vep-cache-builder "$dir"/vep-cache-converter
          "$dir/vep" --version
          "$dir/vep-cache-builder" --help >/dev/null
          "$dir/vep-cache-converter" --help >/dev/null
          corpus="$PWD/tests/golden/116/GRCh37"
          args=(--offline --assembly GRCh37 --force_overwrite --no_stats --quiet)
          mkdir -p "$RUNNER_TEMP/smoke"
          docker run --rm -v "$corpus:/corpus:ro" -v "$dir:/vep:ro" -v "$RUNNER_TEMP/smoke:/out" "$GLIBC_IMAGE" \
            /vep/vep "${args[@]}" -i /corpus/variants.vcf --json_cache /corpus/json_cache -o /out/floor.txt
          "$dir/vep" "${args[@]}" -i "$corpus/variants.vcf" --json_cache "$corpus/json_cache" -o "$RUNNER_TEMP/smoke/runner.txt"
          rows="$(grep -vc '^#' "$RUNNER_TEMP/smoke/floor.txt")" || rows=0
          [ "$rows" -gt 0 ] || { echo "ERROR: [release] vep wrote no rows on the glibc floor" >&2; exit 1; }
          diff <(grep -v '^#' "$RUNNER_TEMP/smoke/floor.txt") <(grep -v '^#' "$RUNNER_TEMP/smoke/runner.txt") ||
            { echo "ERROR: [release] the glibc-floor run and the runner's differ" >&2; exit 1; }
          echo "vep annotated $rows rows on glibc $GLIBC_FLOOR, equal to the runner's"

      - name: Smoke-test the macOS binaries
        if: "!matrix.zig"
        run: |
          dir="dist/vep-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          "$dir/vep" --version
          "$dir/vep-cache-builder" --help >/dev/null
          "$dir/vep-cache-converter" --help >/dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vep-${{ steps.version.outputs.version }}-${{ matrix.name }}
          path: vep-${{ steps.version.outputs.version }}-${{ matrix.name }}.tar.gz

  release:
    name: Checksums, attestations and draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The full history and every tag: `git archive` cuts the source tarball at
      # the released commit, and the previous tag names the compare link.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Resolve the release version and the previous tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -1)"
          fi
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -vx "v$version" | head -1)"
          # A tag renders the version's dated CHANGELOG section; a dry run on a branch whose
          # CHANGELOG has no such section renders `[Unreleased]` dated today.
          if grep -qE "^## \[$version\]" CHANGELOG.md; then
            section="$version"; date_arg=""
          else
            section="Unreleased"; date_arg="--date=$(date -u +%Y-%m-%d)"
          fi
          {
            echo "version=$version"
            echo "previous=${previous:-v0.0.0}"
            echo "section=$section"
            echo "date_arg=$date_arg"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Every binary of every Linux archive, read from its ELF version needs:
      # one requiring a glibc newer than the floor fails the release, and the
      # floors measured per archive are what the release page prints.
      - name: Check the glibc floor of every Linux archive
        run: >-
          python3 scripts/release/check_glibc_floor.py --floor "$GLIBC_FLOOR"
          --json glibc-floors.json vep-*-linux-gnu*.tar.gz

      # The source tarball is `git archive` at the released commit, the file a
      # Zenodo deposit receives and a Bioconda recipe points at; GitHub's own
      # source archives are not byte-stable, so they cannot be verified.
      - name: Cut the source tarball
        run: |
          v="${{ steps.meta.outputs.version }}"
          git archive --format=tar.gz --prefix="vep-rs-$v/" -o "vep-rs-$v.tar.gz" "$GITHUB_SHA"
          sha256sum "vep-rs-$v.tar.gz" > "vep-rs-$v.tar.gz.sha256"

      # One checksum file over every archive, in the format `sha256sum -c` and
      # `shasum -a 256 -c` read; the paper reports the binaries it measured by
      # md5, and those are different builds, so no md5 is published here.
      - name: Write checksums
        run: |
          sha256sum -- vep-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest every file in SHA256SUMS
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      - name: Render the release body
        run: >-
          python3 scripts/release/render_release_notes.py
          --repo .
          --version "${{ steps.meta.outputs.version }}"
          --previous "${{ steps.meta.outputs.previous }}"
          --commit "$GITHUB_SHA"
          --toolchain "$RUST_TOOLCHAIN"
          --sha256sums SHA256SUMS
          --glibc-floors glibc-floors.json
          --changelog-section "${{ steps.meta.outputs.section }}"
          ${{ steps.meta.outputs.date_arg }}
          --out release-body.md

      - name: Upload the dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            vep-*.tar.gz
            vep-rs-*.tar.gz
            vep-rs-*.tar.gz.sha256
            SHA256SUMS
            glibc-floors.json
            release-body.md

      # A draft: visible to write-holders only until a maintainer publishes it.
      - name: Create the draft release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          name: vep-rs ${{ steps.meta.outputs.version }}
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            vep-*.tar.gz
            vep-rs-*.tar.gz
            vep-rs-*.tar.gz.sha256
            SHA256SUMS
