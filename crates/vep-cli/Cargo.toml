[package]
name = "vep-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories = ["science::bioinformatics", "command-line-utilities"]
description = "The vep command: a fast Rust reimplementation of the Ensembl Variant Effect Predictor (VEP) with its flags and output formats"
default-run = "vep"

[lib]
name = "vep_cli"
path = "src/lib.rs"

[[bin]]
name = "vep"
path = "src/main.rs"

[[bin]]
name = "bench_plugins"
path = "src/bin/bench_plugins.rs"

[dependencies]
vep-core = { workspace = true }
vep-effects = { workspace = true }
vep-io = { workspace = true }
vep-plugin = { workspace = true }
vep-builtins = { workspace = true }
vep-fasta = { workspace = true }
noodles = { workspace = true }
noodles-bgzf = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }
flate2 = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
bstr = { workspace = true }
smallvec = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
mimalloc = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "cache_load_bench"
harness = false

[features]
default = ["mimalloc"]
# Use mimalloc as the `vep` binary's global allocator.
mimalloc = ["dep:mimalloc"]
