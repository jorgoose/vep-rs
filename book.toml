# The documentation site, https://natera-open-source.github.io/vep-rs/, built
# from docs/ by .github/workflows/pages.yml. Build it locally with
# `mdbook build` (output in target/book) or preview it with `mdbook serve`.
[book]
title = "vep-rs"
description = "A fast, memory-efficient reimplementation of the Ensembl Variant Effect Predictor in Rust"
authors = ["Matthew Porter", "Robert Borkowski"]
language = "en"
src = "docs"

[build]
build-dir = "target/book"

# The home page is README.md, and links that leave docs/ go to GitHub
# (scripts/docs/mdbook_repo_links.py).
[preprocessor.repo-links]
command = "python3 scripts/docs/mdbook_repo_links.py"

[output.html]
site-url = "/vep-rs/"
git-repository-url = "https://github.com/natera-open-source/vep-rs"
