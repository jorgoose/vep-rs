# The documentation site, https://natera-open-source.github.io/vep-rs/. The
# published site is the latest release's pages, built by
# scripts/docs/build_release_site.sh from .github/workflows/pages.yml. Build
# this checkout's pages with `mdbook build` (output in target/book) or preview
# them with `mdbook serve`.
[book]
title = "vep-rs"
description = "A fast, memory-efficient reimplementation of the Ensembl Variant Effect Predictor in Rust"
authors = ["Matthew Porter", "Robert Borkowski"]
language = "en"
src = "docs"

[build]
build-dir = "target/book"
create-missing = false

# Chapters that mirror a repository file, and links that leave docs/, are
# rewritten by scripts/docs/mdbook_repo_links.py.
[preprocessor.repo-links]
command = "python3 scripts/docs/mdbook_repo_links.py"

[output.html]
site-url = "/vep-rs/"
git-repository-url = "https://github.com/natera-open-source/vep-rs"
edit-url-template = "https://github.com/natera-open-source/vep-rs/edit/main/{path}"
additional-css = ["theme/vep-rs.css", "theme/pagetoc.css"]
additional-js = ["theme/pagetoc.js", "theme/vep-rs.js"]
# The class numbers on the divergence pages are identifiers; chapter numbers
# in the sidebar would compete with them.
no-section-label = true
sidebar-header-nav = false
input-404 = "404.md"

[output.html.fold]
enable = true
level = 1

[output.html.print]
enable = false

[output.html.search]
use-boolean-and = true
limit-results = 20
boost-title = 2
boost-hierarchy = 2
expand = true
# Every CLI option is a level-3 heading, so each is its own search result.
heading-split-level = 3

[output.html.search.chapter]
# Changelog entries name the same options and fields as the reference pages
# and would crowd them out of the results.
"changelog.md" = { enable = false }

